<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branchback · 探索地图</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><span class="mark">⌘</span><strong>Branchback</strong><span class="subtitle">探索地图</span></div><div><span class="readonly">只读 · 本地数据</span><button id="refresh">刷新数据</button></div></header>
<main class="workspace">
<aside class="sidebar"><div class="filters"><h1>项目与探索树</h1><input id="filter" type="search" aria-label="筛选项目与探索树" placeholder="搜索项目或探索树"><label class="check"><input id="hide-ended" type="checkbox">隐藏已结束的树</label><span class="hint">排除已结束 / 已放弃</span></div><nav id="projects" aria-label="项目与探索树"></nav></aside>
<section class="content"><p id="message" role="status"></p><section class="map"><div class="map-heading"><div><h1 id="tree-title">问题树</h1><p class="hint">从上到下查看分支 · 点击节点查看详情</p></div><input id="search" type="search" aria-label="搜索节点" placeholder="搜索节点"><span id="count" class="meta"></span></div><div class="graph-controls"><button id="show-all">展开全树</button><button id="fit">适应全图</button><button id="expand-map">扩大图区</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-reset" title="恢复原始大小">100%</button><button id="zoom-in" aria-label="放大">+</button><span class="hint">拖动空白处平移</span></div><div id="view-mode" class="hint view-mode">完整问题树</div><div id="outline" tabindex="0" aria-label="问题树图，可拖动空白处平移或滚动"></div></section><section class="details-panel" aria-label="节点详情"><div class="detail-heading"><h1>节点详情</h1><button id="expand-detail">扩大详情</button><span id="updated" class="meta"></span></div><div id="detail"></div></section></section>
</main>
</body></html>
